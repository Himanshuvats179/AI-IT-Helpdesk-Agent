# Seed knowledge base. `content` is auto-derived from title/symptoms/steps.
# `requires_tool` ties a step to a real tool so the agent can act, not just advise.

- id: KB-0001
  title: Reset a forgotten Active Directory password
  category: password_reset
  symptoms: ["forgot password", "can't log in", "password not working", "locked out of laptop"]
  applies_to: ["Windows", "macOS", "corporate account"]
  risk_level: medium
  preconditions: ["Requester identity must be verified before resetting."]
  required_tools: ["request_identity_verification", "reset_ad_password"]
  steps:
    - { text: "Confirm the affected account (defaults to the requester).", requires_tool: check_account_status }
    - { text: "Verify the requester's identity with a one-time code sent out-of-band.", requires_tool: request_identity_verification }
    - { text: "Reset the AD password; a temporary credential is sent to the registered factor.", requires_tool: reset_ad_password, destructive: false }
    - { text: "Tell the user to sign in with the temporary credential and set a new password." }

- id: KB-0002
  title: Unlock a locked user account
  category: account_lockout
  symptoms: ["account locked", "too many login attempts", "account is locked", "lockout"]
  applies_to: ["corporate account"]
  risk_level: low
  required_tools: ["check_account_status", "unlock_account"]
  steps:
    - { text: "Check the account status to confirm it is locked.", requires_tool: check_account_status }
    - { text: "Unlock the account.", requires_tool: unlock_account }
    - { text: "Advise the user to wait a minute, then sign in again." }

- id: KB-0003
  title: VPN will not connect (stale profile)
  category: vpn
  symptoms: ["vpn won't connect", "cannot connect to vpn", "vpn error", "vpn disconnects"]
  applies_to: ["Windows", "macOS"]
  risk_level: low
  required_tools: ["run_endpoint_diagnostic"]
  steps:
    - { text: "Run a VPN diagnostic to check client version, profile and gateway reachability.", requires_tool: run_endpoint_diagnostic }
    - { text: "If the profile is stale, re-import the corporate VPN profile and reconnect." }
    - { text: "Confirm the user can reach an internal resource after reconnecting." }

