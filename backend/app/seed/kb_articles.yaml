- id: KB-0007
  title: Outlook is not syncing or sending mail
  category: email
  symptoms: ["outlook not syncing", "emails stuck", "cannot send email", "mailbox not updating"]
  applies_to: ["Outlook", "Windows", "macOS"]
  risk_level: safe
  steps:
    - { text: "Have the user restart Outlook and check the connection status (bottom-right)." }
    - { text: "Toggle Work Offline off; verify network connectivity." }
    - { text: "If still failing, recreate the Outlook profile from a clean state." }

- id: KB-0008
  title: Printer shows offline
  category: printer
  symptoms: ["printer offline", "can't print", "printer not responding", "print job stuck"]
  applies_to: ["network printers"]
  risk_level: safe
  steps:
    - { text: "Power-cycle the printer and confirm it has a network/IP address." }
    - { text: "On the PC, clear the print queue and set the printer back to Ready (uncheck 'Use Printer Offline')." }
    - { text: "Send a test page." }

- id: KB-0009
  title: Computer running slowly
  category: performance
  symptoms: ["slow computer", "laptop is slow", "high cpu", "everything is laggy"]
  applies_to: ["Windows", "macOS"]
  risk_level: safe
  required_tools: ["run_endpoint_diagnostic"]
  steps:
    - { text: "Run a general endpoint diagnostic (CPU, memory, pending reboot).", requires_tool: run_endpoint_diagnostic }
    - { text: "If a reboot is pending, ask the user to restart." }
